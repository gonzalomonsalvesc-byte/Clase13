<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 750">
    <rect width="800" height="750" fill="#fafafa" />

    <text x="400" y="50" text-anchor="middle" font-family="Bricolage Grotesque, sans-serif" font-size="24" font-weight="bold" fill="#333">
        Cómo postular a un intercambio FAU
    </text>

    <!-- Paso 1 -->
    <g>
        <circle cx="100" cy="150" r="30" fill="slategray" />
        <text x="100" y="150" text-anchor="middle" dominant-baseline="middle" font-family="Bricolage Grotesque, sans-serif" font-size="20" font-weight="bold" fill="white">1</text>
        <rect x="150" y="120" width="550" height="60" fill="white" stroke="silver" stroke-width="1" rx="8" />
        <text x="170" y="145" font-family="Bricolage Grotesque, sans-serif" font-size="16" font-weight="bold" fill="#333">Revisar convenios disponibles</text>
        <text x="170" y="165" font-family="Newsreader, serif" font-size="13" fill="#666">Consultar la lista de universidades con convenio FAU.</text>
    </g>

    <!-- Paso 2 -->
    <g>
        <circle cx="100" cy="280" r="30" fill="slategray" />
        <text x="100" y="280" text-anchor="middle" dominant-baseline="middle" font-family="Bricolage Grotesque, sans-serif" font-size="20" font-weight="bold" fill="white">2</text>
        <rect x="150" y="250" width="550" height="60" fill="white" stroke="silver" stroke-width="1" rx="8" />
        <text x="170" y="275" font-family="Bricolage Grotesque, sans-serif" font-size="16" font-weight="bold" fill="#333">Preparar documentos</text>
        <text x="170" y="295" font-family="Newsreader, serif" font-size="13" fill="#666">Reunir CV, portafolio, carta de motivación y notas.</text>
    </g>

    <!-- Paso 3 -->
    <g>
        <circle cx="100" cy="410" r="30" fill="slategray" />
        <text x="100" y="410" text-anchor="middle" dominant-baseline="middle" font-family="Bricolage Grotesque, sans-serif" font-size="20" font-weight="bold" fill="white">3</text>
        <rect x="150" y="380" width="550" height="60" fill="white" stroke="silver" stroke-width="1" rx="8" />
        <text x="170" y="405" font-family="Bricolage Grotesque, sans-serif" font-size="16" font-weight="bold" fill="#333">Postular en línea</text>
        <text x="170" y="425" font-family="Newsreader, serif" font-size="13" fill="#666">Completar el formulario en el portal de la FAU.</text>
    </g>

    <!-- Paso 4 -->
    <g>
        <circle cx="100" cy="540" r="30" fill="slategray" />
        <text x="100" y="540" text-anchor="middle" dominant-baseline="middle" font-family="Bricolage Grotesque, sans-serif" font-size="20" font-weight="bold" fill="white">4</text>
        <rect x="150" y="510" width="550" height="60" fill="white" stroke="silver" stroke-width="1" rx="8" />
        <text x="170" y="535" font-family="Bricolage Grotesque, sans-serif" font-size="16" font-weight="bold" fill="#333">Entrevista con la comisión</text>
        <text x="170" y="555" font-family="Newsreader, serif" font-size="13" fill="#666">Presentarse a la entrevista de la comisión evaluadora.</text>
    </g>

    <!-- Paso 5 -->
    <g>
        <circle cx="100" cy="670" r="30" fill="slategray" />
        <text x="100" y="670" text-anchor="middle" dominant-baseline="middle" font-family="Bricolage Grotesque, sans-serif" font-size="20" font-weight="bold" fill="white">5</text>
        <rect x="150" y="640" width="550" height="60" fill="white" stroke="silver" stroke-width="1" rx="8" />
        <text x="170" y="665" font-family="Bricolage Grotesque, sans-serif" font-size="16" font-weight="bold" fill="#333">Resultados</text>
        <text x="170" y="685" font-family="Newsreader, serif" font-size="13" fill="#666">Revisar resultados y confirmar la plaza asignada.</text>
    </g>

    <!-- Flechas -->
    <line x1="100" y1="180" x2="100" y2="250" stroke="slategray" stroke-width="2" />
    <line x1="100" y1="310" x2="100" y2="380" stroke="slategray" stroke-width="2" />
    <line x1="100" y1="440" x2="100" y2="510" stroke="slategray" stroke-width="2" />
    <line x1="100" y1="570" x2="100" y2="640" stroke="slategray" stroke-width="2" />
</svg>