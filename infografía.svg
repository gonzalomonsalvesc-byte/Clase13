<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%">
    <style>
        .titulo { font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px; font-weight: 600; fill: #333; }
        .paso { font-family: 'Bricolage Grotesque', sans-serif; font-size: 14px; font-weight: 500; fill: #333; }
        .detalle { font-family: 'Newsreader', serif; font-size: 11px; fill: #555; }
        .flecha { stroke: slategray; stroke-width: 2; fill: none; }
        .circulo { fill: slategray; }
        .circulo-texto { font-family: 'Bricolage Grotesque', sans-serif; font-size: 18px; font-weight: 700; fill: white; text-anchor: middle; dominant-baseline: middle; }
        .caja { fill: #f5f5f5; stroke: silver; stroke-width: 1; }
    </style>

    <!-- Fondo -->
    <rect width="800" height="600" fill="#ffffff" />

    <!-- Título -->
    <text x="400" y="40" text-anchor="middle" class="titulo">Proceso de Postulación a Intercambio FAU</text>

    <!-- Paso 1 -->
    <circle cx="100" cy="120" r="30" class="circulo" />
    <text x="100" y="120" class="circulo-texto">1</text>
    <rect x="150" y="90" width="200" height="60" class="caja" rx="4" />
    <text x="160" y="110" class="paso">Revisar convenios</text>
    <text x="160" y="130" class="detalle">Consultar la lista de</text>
    <text x="160" y="145" class="detalle">universidades con convenio FAU.</text>

    <!-- Paso 2 -->
    <circle cx="100" cy="220" r="30" class="circulo" />
    <text x="100" y="220" class="circulo-texto">2</text>
    <rect x="150" y="190" width="200" height="60" class="caja" rx="4" />
    <text x="160" y="210" class="paso">Preparar documentos</text>
    <text x="160" y="230" class="detalle">CV, portafolio, carta</text>
    <text x="160" y="245" class="detalle">de motivación y certificados.</text>

    <!-- Paso 3 -->
    <circle cx="100" cy="320" r="30" class="circulo" />
    <text x="100" y="320" class="circulo-texto">3</text>
    <rect x="150" y="290" width="200" height="60" class="caja" rx="4" />
    <text x="160" y="310" class="paso">Postular en línea</text>
    <text x="160" y="330" class="detalle">Completar el formulario</text>
    <text x="160" y="345" class="detalle">en el portal de la FAU.</text>

    <!-- Paso 4 -->
    <circle cx="100" cy="420" r="30" class="circulo" />
    <text x="100" y="420" class="circulo-texto">4</text>
    <rect x="150" y="390" width="200" height="60" class="caja" rx="4" />
    <text x="160" y="410" class="paso">Entrevista</text>
    <text x="160" y="430" class="detalle">Presentarse a la entrevista</text>
    <text x="160" y="445" class="detalle">con la comisión evaluadora.</text>

    <!-- Paso 5 -->
    <circle cx="100" cy="520" r="30" class="circulo" />
    <text x="100" y="520" class="circulo-texto">5</text>
    <rect x="150" y="490" width="200" height="60" class="caja" rx="4" />
    <text x="160" y="510" class="paso">Resultados</text>
    <text x="160" y="530" class="detalle">Revisar los resultados</text>
    <text x="160" y="545" class="detalle">y confirmar la plaza.</text>

    <!-- Flechas conectoras -->
    <line x1="100" y1="150" x2="100" y2="190" class="flecha" marker-end="url(#arrow)" />
    <line x1="100" y1="250" x2="100" y2="290" class="flecha" marker-end="url(#arrow)" />
    <line x1="100" y1="350" x2="100" y2="390" class="flecha" marker-end="url(#arrow)" />
    <line x1="100" y1="450" x2="100" y2="490" class="flecha" marker-end="url(#arrow)" />

    <!-- Fecha importante -->
    <rect x="400" y="300" width="350" height="80" class="caja" rx="4" fill="#fff3cd" />
    <text x="415" y="325" class="paso">📅 Fecha límite de postulación:</text>
    <text x="415" y="350" class="detalle" font-size="14px">15 de abril de 2027, 23:59 hrs.</text>

    <!-- Contacto -->
    <rect x="400" y="400" width="350" height="80" class="caja" rx="4" />
    <text x="415" y="425" class="paso">📧 Contacto</text>
    <text x="415" y="445" class="detalle">relaciones.internacionales@fau.uchile.cl</text>
    <text x="415" y="465" class="detalle">Oficina FAU: Edificio C, piso 3.</text>

    <!-- Flecha marker def -->
    <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="slategray" />
        </marker>
    </defs>
</svg>